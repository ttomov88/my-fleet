<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Fleet</title>
<meta name="theme-color" content="#F2F3F7" id="themeColor" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180-maskable.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script>
  // Theme before first paint, so there is no light flash in dark mode.
  try {
    var t = (JSON.parse(localStorage.getItem("fleetlog_settings_v1") || "{}").theme) || "auto";
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/app.css?v=16" />
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="appbar-left">
      <button class="round-btn" id="backBtn" data-i18n-aria="back" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div class="appbar-title" id="appbarTitle"></div>
    <div class="appbar-right">
      <span class="sync-dot" id="syncDot" title="Changes wait for internet" hidden></span>
    </div>
  </header>

  <main id="main"></main>

  <section id="settingsPage" class="page" hidden>
    <h1 class="page-title" data-i18n="settings">Settings</h1>
    <div class="profile">
      <div class="profile-avatar" id="profileInitial">·</div>
      <div class="profile-text">
        <div class="profile-email" id="accountEmail"></div>
        <div class="profile-status" id="accountInfo"></div>
      </div>
    </div>

    <div class="group-title" data-i18n="reminders_group">Reminders</div>
    <div class="group">
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="notifications">Notifications</div><div class="row-sub" data-i18n="daily_8">Every day at 08:00</div></div>
        <label class="switch">
          <input type="checkbox" id="notifToggle" data-i18n-aria="reminder_notifications" aria-label="Reminder notifications" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="remind_me">Remind me</div></div>
        <select id="leadDays" class="row-select" data-i18n-aria="remind_me" aria-label="Remind me">
          <option value="7" data-i18n="days_before" data-n="7">7 days before</option>
          <option value="14" data-i18n="days_before" data-n="14">14 days before</option>
          <option value="30" data-i18n="days_before" data-n="30" selected>30 days before</option>
        </select>
      </div>
      <button class="row row-btn" id="testNotifBtn">
        <div class="row-text"><div class="row-title" data-i18n="send_test">Send a test notification</div></div>
        <span class="chev"></span>
      </button>
    </div>

    <div class="group-title" data-i18n="appearance">Appearance</div>
    <div class="group">
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="theme">Theme</div></div>
        <div class="segmented" id="themeSeg" role="radiogroup" data-i18n-aria="theme" aria-label="Theme">
          <button role="radio" data-theme="auto" data-i18n="theme_auto">Auto</button>
          <button role="radio" data-theme="light" data-i18n="theme_light">Light</button>
          <button role="radio" data-theme="dark" data-i18n="theme_dark">Dark</button>
        </div>
      </div>
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="language">Language</div></div>
        <div class="segmented" id="langSeg" role="radiogroup" data-i18n-aria="language" aria-label="Language">
          <button role="radio" data-lang="bg">БГ</button>
          <button role="radio" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <div class="group-title" data-i18n="data_group">Data</div>
    <div class="group">
      <button class="row row-btn" id="restoreBtn">
        <div class="row-text"><div class="row-title" data-i18n="restore_point">Restore point</div><div class="row-sub" data-i18n="restore_sub">Go back to an earlier version</div></div>
        <span class="chev"></span>
      </button>
      <button class="row row-btn" id="exportBtn">
        <div class="row-text"><div class="row-title" data-i18n="export_backup">Export backup</div></div>
        <span class="chev"></span>
      </button>
      <button class="row row-btn" id="importBtn">
        <div class="row-text"><div class="row-title" data-i18n="import_backup">Import backup</div></div>
        <span class="chev"></span>
      </button>
    </div>

    <div class="group-title" data-i18n="account_group">Account</div>
    <div class="group">
      <button class="row row-btn" id="changePwBtn">
        <div class="row-text"><div class="row-title" data-i18n="change_pw">Change password</div></div>
        <span class="chev"></span>
      </button>
      <button class="row row-btn" id="adminResetBtn" hidden>
        <div class="row-text"><div class="row-title" data-i18n="admin_reset">Temporary password for a member</div><div class="row-sub" data-i18n="admin_reset_sub">For someone who forgot theirs</div></div>
        <span class="chev"></span>
      </button>
    </div>
    <div class="group">
      <button class="row row-btn row-danger" id="logoutBtn">
        <div class="row-text"><div class="row-title" data-i18n="log_out">Log out</div></div>
      </button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;" />
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Menu">
    <button class="tab" id="tabHome" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5L12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="tab_home">Home</span>
    </button>
    <button class="tab" id="tabUpcoming" data-tab="upcoming">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span class="tab-badge" id="upcomingBadge" hidden></span>
      </span>
      <span data-i18n="tab_upcoming">Upcoming</span>
    </button>
    <button class="tab" id="settingsBtn" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>
      <span data-i18n="settings">Settings</span>
    </button>
  </nav>
</div>

<div class="overlay" id="categoryPickerOverlay">
  <div class="modal">
    <div class="sheet-grab"></div>
    <h3 data-i18n="add_event_title">Add event</h3>
    <div class="group" id="categoryPickList"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="categoryPickCancel" data-i18n="cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="overlay" id="itemOverlay">
  <div class="modal">
    <div class="sheet-grab"></div>
    <h3 id="itemModalTitle">Add event</h3>
    <div class="field">
      <label for="itemLabel" data-i18n="name">Name</label>
      <input id="itemLabel" autocomplete="off" />
    </div>
    <div class="field-row">
      <div class="field">
        <label for="itemLast" data-i18n="last_done">Last done</label>
        <div class="date-field"><button type="button" class="date-text" aria-haspopup="dialog"></button><input id="itemLast" type="date" hidden /></div>
      </div>
      <div class="field">
        <label for="itemDue" data-i18n="next_due">Next due</label>
        <div class="date-field"><button type="button" class="date-text" aria-haspopup="dialog"></button><input id="itemDue" type="date" hidden /></div>
      </div>
    </div>
    <div class="field">
      <label for="itemNotes" data-i18n="notes">Notes</label>
      <input id="itemNotes" autocomplete="off" />
    </div>
    <div class="chip-row" id="itemStateRow" style="display:none;">
      <button class="chip chip-done" id="itemDoneBtn" aria-pressed="false">Done</button>
      <button class="chip" id="itemRenewBtn" data-i18n="renew">&#8635; Renew for a year</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="itemCancel" data-i18n="cancel">Cancel</button>
      <button class="btn btn-primary" id="itemSave" data-i18n="save">Save</button>
    </div>
    <div class="modal-actions" id="itemDeleteRow" style="display:none;">
      <button class="btn btn-text-danger" id="itemDelete" data-i18n="delete_event">Delete event</button>
    </div>
  </div>
</div>

<div class="overlay" id="vehicleOverlay">
  <div class="modal">
    <div class="sheet-grab"></div>
    <h3 id="vehicleModalTitle">Add vehicle</h3>
    <div class="field">
      <label data-i18n="type">Type</label>
      <div class="type-grid" id="vehicleTypeGrid" role="group" data-i18n-aria="vehicle_type" aria-label="Vehicle type"></div>
    </div>
    <div class="field">
      <label for="vehicleName" data-i18n="name">Name</label>
      <input id="vehicleName" autocomplete="off" />
    </div>
    <div class="field">
      <label for="vehicleReg" data-i18n="registration">Registration</label>
      <input id="vehicleReg" autocomplete="off" />
    </div>
    <div class="field">
      <label for="vehicleVin" data-i18n="vin">VIN</label>
      <input id="vehicleVin" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" style="text-transform:uppercase; letter-spacing:0.3px;" />
    </div>
    <div class="field">
      <label for="vehicleRegDate" data-i18n="reg_date">Registration date</label>
      <div class="date-field"><button type="button" class="date-text" aria-haspopup="dialog"></button><input id="vehicleRegDate" type="date" hidden /></div>
    </div>
    <div class="field">
      <label for="vehicleNote" data-i18n="note_optional">Note (optional)</label>
      <textarea id="vehicleNote" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="vehicleCancel" data-i18n="cancel">Cancel</button>
      <button class="btn btn-primary" id="vehicleSave" data-i18n="save">Save</button>
    </div>
    <div class="modal-actions" id="vehicleDeleteRow" style="display:none;">
      <button class="btn btn-text-danger" id="vehicleDelete" data-i18n="delete_vehicle">Delete vehicle</button>
    </div>
  </div>
</div>

<div class="overlay" id="restoreOverlay">
  <div class="modal">
    <div class="sheet-grab"></div>
    <h3 data-i18n="restore_point">Restore point</h3>
    <div class="group restore-list" id="restoreList"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="restoreClose" data-i18n="cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="overlay" id="passwordOverlay">
  <form class="modal" id="passwordForm" novalidate>
    <div class="sheet-grab"></div>
    <h3 data-i18n="change_pw">Change password</h3>
    <input type="email" autocomplete="username" id="pwUser" hidden />
    <div class="field">
      <label for="pwNew" data-i18n="new_pw">New password</label>
      <input id="pwNew" type="password" autocomplete="new-password" minlength="8" />
    </div>
    <div class="field">
      <label for="pwRepeat" data-i18n="repeat_pw">Repeat the new password</label>
      <input id="pwRepeat" type="password" autocomplete="new-password" minlength="8" />
    </div>
    <div class="login-msg" id="pwMsg" role="alert"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="pwCancel" data-i18n="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="pwSave" data-i18n="save">Save</button>
    </div>
  </form>
</div>

<div class="overlay" id="resetOverlay">
  <form class="modal" id="resetForm" novalidate>
    <div class="sheet-grab"></div>
    <h3 data-i18n="admin_reset">Temporary password for a member</h3>
    <div class="field">
      <label for="resetEmail" data-i18n="member_email">Member's email</label>
      <input id="resetEmail" type="email" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="off" />
    </div>
    <div class="temp-pw" id="resetResult" hidden></div>
    <div class="login-msg" id="resetMsg" role="alert"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="resetClose" data-i18n="close">Close</button>
      <button type="submit" class="btn btn-primary" id="resetGo" data-i18n="make_temp_pw">Create</button>
    </div>
  </form>
</div>

<div class="overlay overlay-top" id="calendarOverlay" role="dialog" aria-modal="true">
  <div class="modal cal-sheet">
    <div class="cal-head">
      <button type="button" class="round-btn" id="calPrev" aria-label="‹"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="cal-title" id="calTitle"></button>
      <button type="button" class="round-btn" id="calNext" aria-label="›"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="calClear" data-i18n="clear">Clear</button>
      <button type="button" class="btn btn-secondary" id="calToday" data-i18n="today">Today</button>
      <button type="button" class="btn btn-primary" id="calCancel" data-i18n="cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="overlay overlay-top" id="confirmOverlay" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal confirm-sheet">
    <h3 id="confirmTitle"></h3>
    <p class="confirm-text" id="confirmText"></p>
    <div class="modal-actions modal-actions-stack">
      <button class="btn btn-primary" id="confirmOk">OK</button>
      <button class="btn btn-secondary" id="confirmCancel" data-i18n="cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="loginScreen" hidden>
  <button type="button" class="lang-switch" id="loginLang" aria-label="Language / Език">EN</button>
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-logo" id="loginIcon"></div>
    <h1 class="login-title">My Fleet</h1>
    <p class="login-sub" data-i18n="login_sub">Vehicles, insurance and inspections. Shared with your family.</p>
    <div class="field">
      <label for="loginEmail" data-i18n="email">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" />
    </div>
    <div class="field">
      <label for="loginPassword" data-i18n="password">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" minlength="8" />
    </div>
    <div class="login-msg" id="loginMsg" role="alert"></div>
    <div class="modal-actions modal-actions-stack">
      <button type="submit" class="btn btn-primary" id="loginBtn" data-i18n="log_in">Log in</button>
      <button type="button" class="btn btn-secondary" id="registerBtn" data-i18n="create_account">Create account</button>
      <button type="button" class="btn btn-text" id="forgotBtn" data-i18n="forgot_pw">Forgot password?</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="js/i18n.js?v=16"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>

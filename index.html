<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Fleet</title>
<meta name="theme-color" content="#0F2547" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180-maskable.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root {
    --navy: #0F2547;
    --navy-2: #16345F;
    --cream: #F7F5F0;
    --paper: #FFFFFF;
    --ink: #1B2530;
    --ink-soft: #5B6572;
    --amber: #E8A33D;
    --green: #2F9E5B;
    --red: #D14343;
    --border: #E4E0D8;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overscroll-behavior-y: contain;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header.topbar {
    background: var(--navy);
    color: var(--cream);
    padding: max(16px, env(safe-area-inset-top)) 16px 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar .brand {
    display: flex; align-items: center; gap: 10px;
    background: none; border: none; padding: 6px; margin: -6px; border-radius: 8px;
    cursor: pointer; color: inherit;
  }
  header.topbar .brand:active { background: rgba(255,255,255,0.08); }
  header.topbar .brand-icon { width: 34px; flex-shrink: 0; color: var(--amber); display: flex; }
  header.topbar .brand-icon svg { width: 100%; height: auto; display: block; }
  header.topbar .brand-title { color: var(--cream); font-size: 16px; font-weight: 700; letter-spacing: 0.2px; opacity: 0.9; }
  header.topbar button.icon-btn {
    background: rgba(255,255,255,0.08); border: none; color: var(--cream);
    width: 36px; height: 36px; border-radius: 10px; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0;
  }

  .grip-icon { flex-shrink: 0; display: flex; opacity: 0.4; touch-action: none; }

  .vehicle-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .vtype-icon {
    width: 58px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: var(--navy); color: var(--amber);
    display: flex; align-items: center; justify-content: center;
  }
  .vtype-icon svg { width: 76%; height: auto; display: block; }
  .vehicle-header .vh-name { font-size: 20px; font-weight: 800; color: var(--navy); line-height: 1.15; }
  .vehicle-header .vh-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .vehicle-header button.rename-btn {
    margin-left: auto; background: var(--paper); border: 1px solid var(--border);
    width: 34px; height: 34px; border-radius: 9px; color: var(--ink-soft); font-size: 14px;
    cursor: pointer; flex-shrink: 0;
  }

  .vehicle-meta {
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px 14px; margin-bottom: 20px;
  }
  .vehicle-meta .meta-row {
    display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .vehicle-meta .meta-row:last-child { border-bottom: none; }
  .vehicle-meta .meta-label {
    flex-shrink: 0; width: 44px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.4px; margin-top: 1px;
  }
  .vehicle-meta .meta-value { color: var(--ink); word-break: break-word; white-space: pre-wrap; }

  .empty-state {
    text-align: center; padding: 60px 24px; color: var(--ink-soft);
  }
  .empty-state .empty-icon {
    width: 88px; height: 66px; margin: 0 auto 14px; border-radius: 18px;
    background: var(--navy); color: var(--amber); display: flex; align-items: center; justify-content: center;
  }
  .empty-state .empty-icon svg { width: 76%; height: auto; display: block; }
  .empty-state .empty-title { font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .empty-state .empty-copy { font-size: 13.5px; line-height: 1.5; max-width: 300px; margin: 0 auto; }
  .empty-state button {
    margin-top: 20px; background: var(--navy); color: var(--cream); border: none;
    padding: 12px 22px; border-radius: 10px; font-weight: 700; font-size: 14.5px; cursor: pointer;
  }

  .picker-list { display: flex; flex-direction: column; gap: 10px; }
  .picker-card {
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; display: flex; align-items: center; gap: 14px; cursor: pointer;
    user-select: none; -webkit-user-select: none; transition: box-shadow 0.15s, transform 0.15s;
  }
  .picker-card.dragging {
    box-shadow: 0 12px 28px rgba(15,37,71,0.28); transform: scale(1.02);
    position: relative; z-index: 20; border-color: var(--amber);
  }
  .picker-card-info { min-width: 0; flex: 1; }
  .picker-card-name { font-weight: 700; font-size: 16px; color: var(--ink); }
  .picker-card-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .picker-card .grip-icon { color: var(--ink-soft); }
  .picker-add {
    margin-top: 14px; width: 100%; background: var(--paper);
    border: 1px dashed var(--border); color: var(--navy);
    border-radius: var(--radius); padding: 10px 14px; font-weight: 700; font-size: 26px; line-height: 1; cursor: pointer;
  }

  .category-pick-list { display: flex; flex-direction: column; gap: 8px; }
  .category-pick-item {
    display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--cream); cursor: pointer; text-align: left;
    width: 100%; font-size: 15px; font-weight: 600; color: var(--ink);
  }
  .category-pick-item .cat-icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; }
  .category-pick-item .cat-icon svg { width: 20px; height: 20px; }

  .status-count {
    flex-shrink: 0; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 700; color: white;
  }
  .status-count.sc-red { background: var(--red); }
  .status-count.sc-amber { background: var(--amber); color: var(--navy); }

  main { flex: 1; padding: 16px; padding-bottom: 100px; max-width: 640px; margin: 0 auto; width: 100%; }

  .section { margin-bottom: 22px; padding-left: 12px; border-left: 3px solid var(--cat-accent, var(--border)); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-head-title { display: flex; align-items: center; gap: 8px; }
  .section-head-title .cat-icon { width: 16px; height: 16px; display: flex; flex-shrink: 0; }
  .section-head-title .cat-icon svg { width: 16px; height: 16px; }
  .section-head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-soft); margin: 0; }
  .section-head button {
    background: none; border: none; color: var(--navy); font-weight: 700; font-size: 24px; line-height: 1;
    cursor: pointer; width: 36px; height: 32px; margin-right: -8px;
    display: flex; align-items: center; justify-content: center;
  }

  .item-card {
    background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
    cursor: pointer;
  }
  .item-card:active { background: var(--cream); }
  .item-card.is-done { opacity: 0.55; }   /* completed events: grayed out */
  .item-badge {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .badge-green { background: var(--green); box-shadow: 0 0 0 4px rgba(47,158,91,0.14); }
  .badge-amber { background: var(--amber); box-shadow: 0 0 0 4px rgba(232,163,61,0.16); }
  .badge-red { background: var(--red); box-shadow: 0 0 0 4px rgba(209,67,67,0.15); }
  .badge-none { background: #B9B2A3; box-shadow: 0 0 0 4px rgba(91,101,114,0.12); }

  .item-main { flex: 1; min-width: 0; }
  .item-main .label { font-weight: 600; font-size: 15px; }
  .item-main .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .empty-hint { font-size: 13px; color: var(--ink-soft); padding: 10px 2px; }

  .fab {
    position: fixed; bottom: 22px; right: 20px;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--amber); color: var(--navy); border: none;
    font-size: 26px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 18px rgba(15,37,71,0.25);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,37,71,0.45); display: none;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom)) 20px; max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 14px 0; font-size: 17px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 15px; background: var(--cream); color: var(--ink);
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .restore-list { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; }
  .restore-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
    padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--cream); color: var(--ink); font-family: inherit; text-align: left; cursor: pointer;
  }
  .restore-item .when { font-weight: 600; font-size: 14.5px; }
  .restore-item .what { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .restore-item:disabled { opacity: 0.6; cursor: default; }
  .btn-done { background: rgba(47,158,91,0.12); color: var(--green); }
  .btn-done[aria-pressed="true"] { background: var(--green); color: #fff; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { padding-left: 6px; padding-right: 6px; white-space: nowrap; }
  .btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: var(--navy); color: var(--cream); }
  .btn-secondary { background: var(--cream); color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: #FBEAEA; color: var(--red); }

  .type-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .type-opt {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 1px 7px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--cream); color: var(--ink-soft); cursor: pointer;
    font-family: inherit; font-size: 10px; font-weight: 600; white-space: nowrap; min-width: 0;
  }
  .type-opt svg { width: 100%; max-width: 40px; height: auto; display: block; }
  .type-opt[aria-pressed="true"] { background: var(--navy); border-color: var(--amber); color: var(--amber); }
  .type-opt[aria-pressed="true"] span { color: var(--cream); }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: var(--cream); padding: 11px 18px; border-radius: 10px;
    font-size: 13.5px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }

  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0;
  }
  .settings-row + .settings-row { border-top: 1px solid var(--border); }
  .settings-row div.label-block .t { font-weight: 600; font-size: 14.5px; }
  .switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #D8D3C8; border-radius: 999px; cursor: pointer; transition: 0.2s; }
  .slider:before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  input:checked + .slider { background: var(--green); }
  input:checked + .slider:before { transform: translateX(18px); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="brandHomeBtn" aria-label="Go to home screen">
      <span class="brand-icon" id="brandIcon"></span>
      <span class="brand-title">My Fleet</span>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>
  </header>

  <main id="main"></main>

  <button class="fab" id="fabAdd" aria-label="Add event">+</button>
</div>

<div class="overlay" id="categoryPickerOverlay">
  <div class="modal">
    <h3>Add event to&hellip;</h3>
    <div class="category-pick-list" id="categoryPickList"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="categoryPickCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="overlay" id="itemOverlay">
  <div class="modal">
    <h3 id="itemModalTitle">Add event</h3>
    <div class="field">
      <label for="itemLabel">Name</label>
      <input id="itemLabel" />
    </div>
    <div class="field">
      <label for="itemLast">Last done</label>
      <input id="itemLast" type="date" />
    </div>
    <div class="field">
      <label for="itemDue">Next due</label>
      <input id="itemDue" type="date" />
    </div>
    <div class="field">
      <label for="itemNotes">Notes</label>
      <input id="itemNotes" />
    </div>
    <div class="modal-actions" id="itemStateRow" style="display:none;">
      <button class="btn btn-done" id="itemDoneBtn" aria-pressed="false">Done</button>
      <button class="btn btn-secondary" id="itemRenewBtn">&#8635; Renew</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="itemCancel">Cancel</button>
      <button class="btn btn-primary" id="itemSave">Save</button>
    </div>
    <div class="modal-actions" id="itemDeleteRow" style="display:none;">
      <button class="btn btn-danger" id="itemDelete">Delete event</button>
    </div>
  </div>
</div>

<div class="overlay" id="vehicleOverlay">
  <div class="modal">
    <h3 id="vehicleModalTitle">Add vehicle</h3>
    <div class="field">
      <label>Vehicle type</label>
      <div class="type-grid" id="vehicleTypeGrid" role="group" aria-label="Vehicle type"></div>
    </div>
    <div class="field">
      <label for="vehicleName">Vehicle name</label>
      <input id="vehicleName" />
    </div>
    <div class="field">
      <label for="vehicleReg">Registration number</label>
      <input id="vehicleReg" />
    </div>
    <div class="field">
      <label for="vehicleVin">VIN</label>
      <input id="vehicleVin" style="text-transform:uppercase;" />
    </div>
    <div class="field">
      <label for="vehicleNote">Note (optional)</label>
      <textarea id="vehicleNote" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="vehicleCancel">Cancel</button>
      <button class="btn btn-primary" id="vehicleSave">Save</button>
    </div>
    <div class="modal-actions" id="vehicleDeleteRow" style="display:none;">
      <button class="btn btn-danger" id="vehicleDelete">Delete vehicle</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Settings</h3>
    <div class="settings-row">
      <div class="label-block">
        <div class="t">Reminder notifications</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="notifToggle" aria-label="Reminder notifications" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="settings-row">
      <div class="label-block">
        <div class="t">Remind me</div>
      </div>
      <select id="leadDays" aria-label="Remind me" style="width:150px; padding:8px; border-radius:8px; border:1px solid var(--border); background: var(--cream);">
        <option value="7">7 days before</option>
        <option value="14">14 days before</option>
        <option value="30" selected>30 days before</option>
      </select>
    </div>
    <div class="settings-row">
      <div class="label-block">
        <div class="t">Auto-backup</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoBackupToggle" aria-label="Auto-backup" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="settings-row">
      <div class="label-block">
        <div class="t">Export backup</div>
      </div>
      <button class="btn btn-secondary" style="flex:none; padding:9px 14px;" id="exportBtn">Export</button>
    </div>
    <div class="settings-row">
      <div class="label-block">
        <div class="t">Import backup</div>
      </div>
      <button class="btn btn-secondary" style="flex:none; padding:9px 14px;" id="importBtn">Import</button>
    </div>
    <div class="settings-row">
      <div class="label-block">
        <div class="t">Restore point</div>
      </div>
      <button class="btn btn-secondary" style="flex:none; padding:9px 14px;" id="restoreBtn">Restore</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;" />
    <div class="modal-actions">
      <button class="btn btn-primary" id="settingsClose">Done</button>
    </div>
  </div>
</div>

<div class="overlay" id="restoreOverlay">
  <div class="modal">
    <h3>Restore point</h3>
    <div class="restore-list" id="restoreList"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="restoreClose">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Data layer ---------------- */
const STORAGE_KEY = "fleetlog_v1";
const SETTINGS_KEY = "fleetlog_settings_v1";
const CATEGORIES = [
  { key: "maintenance", label: "Maintenance" },
  { key: "insurance", label: "Insurance" },
  { key: "inspection", label: "Technical Inspection" }
];

const CATEGORY_ACCENT = { maintenance: "#2F9E5B", insurance: "#7FA9E0", inspection: "#E8A33D" };
const CATEGORY_ICONS = {
  maintenance: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2 2.6-2.6z"/></svg>',
  insurance: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>',
  inspection: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 3.5h6v2H9z" fill="currentColor" stroke="none"/><path d="M9 12l2 2 4-4"/></svg>'
};

// Every event repeats yearly: Next due is one year after Last done, and Renew moves on one year.
const REPEAT_YEARLY = 12;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Accepts saved data or a backup file and returns a clean { vehicles } object, or null if it
// isn't My Fleet data at all. Fills in anything missing (ids, event lists) so a partial or
// hand-edited file can't crash the app, and drops broken entries.
function normalizeData(raw) {
  if (!raw || !Array.isArray(raw.vehicles)) return null;
  const str = v => (v === undefined || v === null) ? "" : String(v);
  const date = v => (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null;
  const seen = new Set();
  const freshId = id => { let x = (typeof id === "string" && id) ? id : uid(); while (seen.has(x)) x = uid(); seen.add(x); return x; };
  const vehicles = raw.vehicles.filter(v => v && typeof v === "object").map(v => {
    const items = {};
    CATEGORIES.forEach(c => {
      const list = v.items && Array.isArray(v.items[c.key]) ? v.items[c.key] : [];
      // attachment belonged to the removed photo/document feature: drop it
      // repeatMonths belonged to the per-event repeat setting (now: every event is yearly)
      items[c.key] = list.filter(i => i && typeof i === "object").map(({ attachment, repeatMonths, ...i }) => ({
        ...i, id: freshId(i.id), label: str(i.label) || "Untitled", dueDate: date(i.dueDate), lastDate: date(i.lastDate),
        notes: str(i.notes), done: i.done === true
      }));
    });
    const { photo, ...rest } = v;   // vehicle photos were removed too
    return { ...rest, id: freshId(v.id), name: str(v.name) || "Unnamed vehicle",
      registration: str(v.registration), vin: str(v.vin), note: str(v.note), items };
  });
  return { vehicles };
}

let dataLoadProblem = false;
let hadLegacyFields = false;   // saved data still mentions removed photos/documents
function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (raw) {
    try {
      const data = normalizeData(JSON.parse(raw));
      if (data) { hadLegacyFields = /"(photo|attachment)"\s*:/.test(raw); return data; }
    } catch (e) {}
    // Saved data exists but can't be read: keep one copy so the next save doesn't destroy it.
    try { if (!localStorage.getItem(STORAGE_KEY + "_unreadable")) localStorage.setItem(STORAGE_KEY + "_unreadable", raw); } catch (e) {}
    dataLoadProblem = true;
  }
  return { vehicles: [] };
}
// Every saved change silently adds a restore point and, on the first save of the day, writes
// one backup file to Downloads. Pass false for internal writes that aren't a user change.
function saveData(backup = true) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  } catch (e) {
    showToast("Couldn't save. Phone storage may be full");
    return false;
  }
  if (backup) { addRestorePoint(); scheduleDailyBackup(); }
  return true;
}

/* ---------------- Restore points ----------------
   A silent copy of the data after each saved change, kept inside the app (last 20). No file,
   no prompt. They live in the same storage as the data, so clearing the app's data or
   uninstalling removes them too; the daily backup file in Downloads covers that case. */
const RESTORE_KEY = "fleetlog_restore_points";
const RESTORE_MAX = 20;
function loadRestorePoints() {
  try {
    const list = JSON.parse(localStorage.getItem(RESTORE_KEY) || "[]");
    return Array.isArray(list) ? list.filter(p => p && typeof p.t === "number" && p.data) : [];
  } catch (e) { return []; }
}
function addRestorePoint() {
  const json = JSON.stringify(state.data);
  let points = loadRestorePoints();
  if (points[0] && JSON.stringify(points[0].data) === json) return;   // nothing changed since the last one
  points.unshift({ t: Date.now(), data: JSON.parse(json) });
  points = points.slice(0, RESTORE_MAX);
  while (points.length) {                                             // storage tight: keep fewer, never fail the save
    try { localStorage.setItem(RESTORE_KEY, JSON.stringify(points)); return; } catch (e) { points.pop(); }
  }
}

  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) { const st = JSON.parse(raw); if (st && typeof st === "object") return { ...DEFAULT_SETTINGS, ...st }; }
  } catch (e) {}
  return { ...DEFAULT_SETTINGS };
}

/* ---------------- Date helpers ----------------
   All dates are the phone's LOCAL date. (toISOString() is UTC, which in Bulgaria
   is a day behind between midnight and 2-3am.) */
function localISO(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
// Adds whole months, clamping to the month's last day (31 Jan + 1 month = 28/29 Feb, not 3 Mar).
function addMonthsISO(dateStr, months) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const t = new Date(y, m - 1 + months, 1);
  t.setDate(Math.min(d, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
  return localISO(t);
}
function formatDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
// A completed event (Done + Save): grayed out, never overdue, no reminders.
function isDone(item) { return item.done === true; }
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr + "T00:00:00");
  return Math.round((due - today) / 86400000);
}
function statusClass(days) {
  if (days === null) return "badge-none";
  if (days < 0) return "badge-red";
  if (days <= 30) return "badge-amber";
  return "badge-green";
}
function humanDue(days, dateStr) {
  if (days === null) return "No date set";
  const formatted = formatDate(dateStr);
  if (days < 0) return `Overdue by ${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"} · ${formatted}`;
  if (days === 0) return `Due today · ${formatted}`;
  return `Due in ${days} day${days === 1 ? "" : "s"} · ${formatted}`;
}

/* ---------------- Back-gesture / history navigation ----------------
   The app is a single page with no real URLs, so by default there's nothing
   for the phone's back gesture to step through — it falls straight through
   to closing the installed app. We fix that by pushing a history entry each
   time a screen/modal opens, and only ever closing things via history
   navigation (closeNav), so a real back-gesture and an in-app Cancel/Save
   button both funnel through the same single close handler below. */
let navDepth = 0;
let exitArmed = false;
let exitArmTimer = null;
function pushNav() {
  if (exitArmed) restoreRootSentinel();   // did something else instead of exiting: re-arm the guard first
  navDepth++;
  history.pushState({ fleetNav: navDepth }, "", location.href);
}
// The bottom-most app history entry. While it exists, a back press on the home page is caught
// (to show "Press back again to exit"); once it's been popped, the next back press exits.
function restoreRootSentinel() {
  exitArmed = false;
  clearTimeout(exitArmTimer);
  navDepth++;
  history.pushState({ fleetNav: navDepth }, "", location.href);
}
function replaceNav() { history.replaceState({ fleetNav: navDepth }, "", location.href); }
// While a close is on its way (history.back() is asynchronous) further taps on Save /
// Cancel / Delete are ignored, so a quick double-tap can't save twice or close two screens.
let navClosing = false, navClosingTimer = null, suppressPops = 0;
function closeNav() {
  if (navClosing) return;
  navClosing = true;
  clearTimeout(navClosingTimer);
  navClosingTimer = setTimeout(() => { navClosing = false; }, 800);   // safety net
  history.back();
}
window.addEventListener("popstate", () => {
  navClosing = false;
  clearTimeout(navClosingTimer);
  if (suppressPops > 0) { suppressPops--; return; }
  if (navDepth > 0) navDepth--;
  performTopLevelClose();
});
// Close everything and return to the home page in one step, keeping the back-gesture
// history in sync (used after deleting the open vehicle and after importing a backup).
function goToRoot() {
  document.querySelectorAll(".overlay.open").forEach(o => o.classList.remove("open"));   // every panel, incl. any added later
  state.editing = null;
  state.activeVehicleId = null;
  render();
  const steps = navDepth - 1;            // entries above the root sentinel
  if (steps > 0) {
    navDepth = 1;
    suppressPops++;
    navClosing = true;
    clearTimeout(navClosingTimer);
    navClosingTimer = setTimeout(() => { navClosing = false; }, 800);
    history.go(-steps);
  }
}
function performTopLevelClose() {
  if (itemOverlay.classList.contains("open")) { itemOverlay.classList.remove("open"); state.editing = null; return; }
  if (vehicleOverlay.classList.contains("open")) { vehicleOverlay.classList.remove("open"); return; }
  if (categoryPickerOverlay.classList.contains("open")) { categoryPickerOverlay.classList.remove("open"); return; }
  if (restoreOverlay.classList.contains("open")) { restoreOverlay.classList.remove("open"); return; }
  if (settingsOverlay.classList.contains("open")) { settingsOverlay.classList.remove("open"); return; }
  if (state.activeVehicleId) { state.activeVehicleId = null; render(); return; }
  // On the home page with nothing open: this press just used up the root sentinel, so the
  // phone is now on the app's first history entry and the NEXT back press closes the app.
  // If that second press doesn't come within 2 seconds, put the sentinel back.
  if (!exitArmed) {
    exitArmed = true;
    showToast("Press back again to exit");
    clearTimeout(exitArmTimer);
    exitArmTimer = setTimeout(() => { if (exitArmed) restoreRootSentinel(); }, 2000);
  }
}

const GRIP_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>';

// Press-and-hold on a vehicle card/row to drag-reorder it. A short hold (350ms)
// distinguishes "reorder" from a normal tap/scroll; small movement before that
// cancels the hold so scrolling the list still works normally.
function enableDragReorder(el, container, vehicleId, onTap) {
  el.dataset.vehicleId = vehicleId;
  let longPressTimer = null;
  let dragging = false;
  let hasDragged = false;
  let startX = 0, startY = 0;
  let pointerId = null;

  // Once a drag has started, stop the page from scrolling. (Changing touch-action mid-gesture
  // has no effect on Android, so without this the browser grabs the finger as a scroll and
  // cancels the drag.) Also suppress the long-press context menu.
  el.addEventListener("touchmove", (e) => { if (dragging) e.preventDefault(); }, { passive: false });
  el.addEventListener("contextmenu", (e) => e.preventDefault());

  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    pointerId = e.pointerId;
    hasDragged = false;
    longPressTimer = setTimeout(() => {
      dragging = true;
      hasDragged = true;
      try { el.setPointerCapture(pointerId); } catch (err) {}
      el.classList.add("dragging");
      el.style.touchAction = "none";
      if (navigator.vibrate) navigator.vibrate(25);
    }, 350);
  });

  el.addEventListener("pointermove", (e) => {
    if (!dragging) {
      if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
        clearTimeout(longPressTimer);
      }
      return;
    }
    e.preventDefault();
    const currentY = e.clientY;
    const others = Array.from(container.children).filter(c => c !== el);
    let insertBefore = null;
    for (const other of others) {
      const rect = other.getBoundingClientRect();
      if (currentY < rect.top + rect.height / 2) { insertBefore = other; break; }
    }
    if (insertBefore) {
      if (insertBefore !== el.nextSibling) container.insertBefore(el, insertBefore);
    } else if (container.lastElementChild !== el) {
      container.appendChild(el);
    }
  });

  function endDrag() {
    clearTimeout(longPressTimer);
    if (dragging) {
      dragging = false;
      el.classList.remove("dragging");
      el.style.touchAction = "";
      try { el.releasePointerCapture(pointerId); } catch (err) {}
      const newOrderIds = Array.from(container.children).map(c => c.dataset.vehicleId).filter(Boolean);
      const oldOrder = state.data.vehicles.map(v => v.id).join();
      state.data.vehicles.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));
      render();
      // A press-and-hold that ends where it started isn't a change: no save, no backup file.
      if (state.data.vehicles.map(v => v.id).join() !== oldOrder) {
        saveData();
        showToast("Vehicle order updated");
      }
    }
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  el.addEventListener("click", (e) => {
    if (hasDragged) { hasDragged = false; e.stopPropagation(); return; }
    onTap();
  });
}

function vehicleStatusCounts(vehicle) {
  let overdue = 0, soon = 0;
  CATEGORIES.forEach(cat => {
    (vehicle.items[cat.key] || []).forEach(item => {
      if (isDone(item)) return;
      const days = daysUntil(item.dueDate);
      if (days === null) return;
      if (days < 0) overdue++;
      else if (days <= 30) soon++;
    });
  });
  return { overdue, soon };
}
function statusCountBadgeHTML(vehicle) {
  const { overdue, soon } = vehicleStatusCounts(vehicle);
  if (overdue > 0) return `<span class="status-count sc-red">${overdue}</span>`;
  if (soon > 0) return `<span class="status-count sc-amber">${soon}</span>`;
  return "";
}

    addBtn.setAttribute("aria-label", "Add to " + cat.label);
    addBtn.title = "Add to " + cat.label;
    addBtn.onclick = () => openItemModal(vehicle.id, cat.key, null);
    head.appendChild(addBtn);
    section.appendChild(head);

    const items = (vehicle.items[cat.key] || []).slice().sort((a,b) => {
      if (isDone(a) !== isDone(b)) return isDone(a) ? 1 : -1;          // completed events go last
      const da = daysUntil(a.dueDate); const db = daysUntil(b.dueDate);
      if (da === null && db === null) return 0;
      if (da === null) return 1; if (db === null) return -1;
      return isDone(a) ? db - da : da - db;                              // finished: newest first
    });

    if (items.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = `No ${cat.label.toLowerCase()} events yet.`;
      section.appendChild(hint);
    } else {
      items.forEach(item => {
        const days = daysUntil(item.dueDate);
        const done = isDone(item);
        const card = document.createElement("div");
        card.className = done ? "item-card is-done" : "item-card";
        const doneOn = item.lastDate || item.dueDate;
        card.innerHTML = `
          <div class="item-badge ${done ? "badge-none" : statusClass(days)}"></div>
          <div class="item-main">
            <div class="label">${escapeHtml(item.label)}</div>
            <div class="sub">${done ? (doneOn ? "Done · " + formatDate(doneOn) : "Done") : humanDue(days, item.dueDate)}</div>
          </div>
        `;
        // Whole card = edit. Only one explicit action lives on it: Done.
        card.setAttribute("role", "button");
        card.tabIndex = 0;
        card.onclick = () => openItemModal(vehicle.id, cat.key, item.id);
        card.onkeydown = (e) => {
          if (e.target === card && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            openItemModal(vehicle.id, cat.key, item.id);
          }
        };
        section.appendChild(card);
      });
    }
    mainEl.appendChild(section);
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

let lastRenderDay = null;
function render() {
  lastRenderDay = localISO();
  renderVehicle();
  updateFabVisibility();
}

/* ---------------- Item modal ---------------- */
const itemOverlay = document.getElementById("itemOverlay");
const itemLabel = document.getElementById("itemLabel");
const itemLast = document.getElementById("itemLast");
const itemDue = document.getElementById("itemDue");
const itemNotes = document.getElementById("itemNotes");
const itemDeleteRow = document.getElementById("itemDeleteRow");
const itemModalTitle = document.getElementById("itemModalTitle");
const itemStateRow = document.getElementById("itemStateRow");
const itemDoneBtn = document.getElementById("itemDoneBtn");
const itemRenewBtn = document.getElementById("itemRenewBtn");
// Done and Renew only change the form. Nothing is stored until Save; Cancel throws it away.
let formDone = false;

// Done / Renew appear only on saved events. Done is a toggle: pressed = completed.
function syncItemForm() {
  itemStateRow.style.display = state.editing && state.editing.itemId ? "flex" : "none";
  itemDoneBtn.setAttribute("aria-pressed", formDone ? "true" : "false");
  itemDoneBtn.textContent = formDone ? "\u2713 Done" : "Done";
}
// Every event repeats yearly: entering Last done fills Next due one year later.
itemLast.addEventListener("change", () => {
  if (itemLast.value) itemDue.value = addMonthsISO(itemLast.value, REPEAT_YEARLY);
});
itemDoneBtn.onclick = () => { formDone = !formDone; syncItemForm(); };
// Renew: the next yearly period. Next due becomes Last done, and Next due moves on one year
// (no Next due yet: the period starts today). Changes only these two dates.
itemRenewBtn.onclick = () => {
  const start = itemDue.value || localISO();
  itemLast.value = start;
  itemDue.value = addMonthsISO(start, REPEAT_YEARLY);
};
function openItemModal(vehicleId, category, itemId, replace) {
  state.editing = { vehicleId, category, itemId };
  const vehicle = state.data.vehicles.find(v => v.id === vehicleId);
  const item = itemId ? vehicle.items[category].find(i => i.id === itemId) : null;
  itemModalTitle.textContent = item ? "Edit event" : "Add event";
  itemLabel.value = item ? item.label : "";
  itemLast.value = item ? item.lastDate || "" : "";
  itemDue.value = item ? item.dueDate || "" : "";
  formDone = !!(item && item.done);
  itemNotes.value = item ? item.notes || "" : "";
  itemDeleteRow.style.display = item ? "flex" : "none";
  syncItemForm();
  itemOverlay.classList.add("open");
  if (replace) replaceNav(); else pushNav();
}
function closeItemModal() { closeNav(); }

document.getElementById("itemCancel").onclick = closeItemModal;
function saveItemForm() {
  if (navClosing || !state.editing || !itemOverlay.classList.contains("open")) return;
  const { vehicleId, category, itemId } = state.editing;
  const vehicle = state.data.vehicles.find(v => v.id === vehicleId);
  if (!itemLabel.value.trim()) { showToast("Please enter a name"); return; }
  const fields = {
    label: itemLabel.value.trim(),
    lastDate: itemLast.value || null,
    dueDate: itemDue.value || null,
    done: formDone,
    notes: itemNotes.value.trim()
  };
  if (itemId) Object.assign(vehicle.items[category].find(i => i.id === itemId), fields);
  else vehicle.items[category].push({ id: uid(), ...fields });
  saveData();
  closeItemModal();
  render();
  checkDueReminders(true);
}
document.getElementById("itemSave").onclick = () => saveItemForm();
document.getElementById("itemDelete").onclick = () => {
  if (navClosing || !state.editing || !itemOverlay.classList.contains("open")) return;
  const { vehicleId, category, itemId } = state.editing;
  const vehicle = state.data.vehicles.find(v => v.id === vehicleId);
  const item = vehicle.items[category].find(i => i.id === itemId);
  if (!confirm(`Delete "${item ? item.label : "this event"}"? This can't be undone.`)) return;
  vehicle.items[category] = vehicle.items[category].filter(i => i.id !== itemId);
  saveData();
  closeItemModal();
  render();
};

const categoryPickerOverlay = document.getElementById("categoryPickerOverlay");

function openCategoryPicker() {
  const list = document.getElementById("categoryPickList");
  list.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "category-pick-item";
    btn.innerHTML = `<span class="cat-icon" style="color:${CATEGORY_ACCENT[cat.key]}">${CATEGORY_ICONS[cat.key]}</span><span>${cat.label}</span>`;
    btn.onclick = () => {
      if (navClosing || !categoryPickerOverlay.classList.contains("open")) return;
      categoryPickerOverlay.classList.remove("open");
      openItemModal(state.activeVehicleId, cat.key, null, true);
    };
    list.appendChild(btn);
  });
  categoryPickerOverlay.classList.add("open");
  pushNav();
}
document.getElementById("categoryPickCancel").onclick = () => closeNav();

document.getElementById("fabAdd").onclick = () => {
  if (!state.activeVehicleId) { openVehicleModal(); return; }
  openCategoryPicker();
};

function updateFabVisibility() {
  document.getElementById("fabAdd").style.display = state.activeVehicleId ? "flex" : "none";
}

/* ---------------- Vehicle modal (add / rename / delete) ---------------- */
const vehicleOverlay = document.getElementById("vehicleOverlay");
const vehicleModalTitle = document.getElementById("vehicleModalTitle");
const vehicleDeleteRow = document.getElementById("vehicleDeleteRow");
const vehicleTypeGrid = document.getElementById("vehicleTypeGrid");
let editingVehicleId = null;
let selectedVehicleType = DEFAULT_VEHICLE_TYPE;

document.getElementById("vehicleCancel").onclick = () => closeNav();

function renderTypePicker() {
  vehicleTypeGrid.innerHTML = "";
  VEHICLE_TYPES.forEach(t => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "type-opt";
    btn.setAttribute("aria-pressed", t.key === selectedVehicleType ? "true" : "false");
    btn.innerHTML = vehicleIconSvg(t.key) + `<span>${t.label}</span>`;
    btn.onclick = () => { selectedVehicleType = t.key; renderTypePicker(); };
    vehicleTypeGrid.appendChild(btn);
  });
}

function openVehicleModal() {
  editingVehicleId = null;
  selectedVehicleType = DEFAULT_VEHICLE_TYPE;
  vehicleModalTitle.textContent = "Add vehicle";
  vehicleDeleteRow.style.display = "none";
  document.getElementById("vehicleName").value = "";
  document.getElementById("vehicleReg").value = "";
  document.getElementById("vehicleVin").value = "";
  document.getElementById("vehicleNote").value = "";
  renderTypePicker();
  vehicleOverlay.classList.add("open");
  pushNav();
}

function openVehicleEditModal(vehicleId) {
  const v = state.data.vehicles.find(x => x.id === vehicleId);
  if (!v) return;
  editingVehicleId = vehicleId;
  selectedVehicleType = vehicleTypeOf(v);
  vehicleModalTitle.textContent = "Edit vehicle";
  vehicleDeleteRow.style.display = "flex";
  document.getElementById("vehicleName").value = v.name;
  document.getElementById("vehicleReg").value = v.registration || "";
  document.getElementById("vehicleVin").value = v.vin || "";
  document.getElementById("vehicleNote").value = v.note || "";
  renderTypePicker();
  vehicleOverlay.classList.add("open");
  pushNav();
}

document.getElementById("vehicleSave").onclick = () => {
  if (navClosing || !vehicleOverlay.classList.contains("open")) return;
  const name = document.getElementById("vehicleName").value.trim();
  const registration = document.getElementById("vehicleReg").value.trim();
  const vin = document.getElementById("vehicleVin").value.trim().toUpperCase();
  const note = document.getElementById("vehicleNote").value.trim();
  if (!name) { showToast("Please enter a vehicle name"); return; }
  if (editingVehicleId) {
    const v = state.data.vehicles.find(x => x.id === editingVehicleId);
    v.name = name;
    v.type = selectedVehicleType;
    v.registration = registration;
    v.vin = vin;
    v.note = note;
    saveData();
    render();
    showToast("Vehicle updated");
    closeNav();
  } else {
    const wasAtRoot = !state.activeVehicleId;
    const v = { id: uid(), name, type: selectedVehicleType, registration, vin, note, items: { maintenance: [], insurance: [], inspection: [] } };
    state.data.vehicles.push(v);
    state.activeVehicleId = v.id;
    saveData();
    render();
    // Creating a vehicle from the root screen both closes this modal and enters
    // vehicle-detail in one motion — net navigation depth is unchanged, so relabel
    // the current history entry instead of popping it.
    if (wasAtRoot) { vehicleOverlay.classList.remove("open"); replaceNav(); }
    else { closeNav(); }
  }
};

document.getElementById("vehicleDelete").onclick = () => {
  if (navClosing || !editingVehicleId || !vehicleOverlay.classList.contains("open")) return;
  const v = state.data.vehicles.find(x => x.id === editingVehicleId);
  if (!v || !confirm(`Delete "${v.name}" and all its events? This can't be undone.`)) return;
  state.data.vehicles = state.data.vehicles.filter(x => x.id !== editingVehicleId);
  saveData();
  goToRoot();                       // the vehicle you were on is gone: back to the home page
  showToast("Vehicle deleted");
};

/* ---------------- Settings modal ---------------- */
const settingsOverlay = document.getElementById("settingsOverlay");
document.getElementById("settingsBtn").onclick = () => {
  document.getElementById("notifToggle").checked = !!state.settings.notifications;
  document.getElementById("leadDays").value = state.settings.leadDays || 30;
  document.getElementById("autoBackupToggle").checked = state.settings.autoBackup !== false;
  settingsOverlay.classList.add("open");
  pushNav();
};
document.getElementById("settingsClose").onclick = () => closeNav();

document.getElementById("autoBackupToggle").onchange = (e) => {
  state.settings.autoBackup = e.target.checked;
  saveSettings();
};

document.getElementById("notifToggle").onchange = async (e) => {
  if (e.target.checked) {
    if (!("Notification" in window)) {
      showToast("Notifications aren't supported in this browser");
      e.target.checked = false; return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      showToast("Notification permission was not granted");
      e.target.checked = false; return;
    }
    state.settings.notifications = true;
  } else {
    state.settings.notifications = false;
  }
  saveSettings();
  if (state.settings.notifications) checkDueReminders(true);   // show what's due right away
};
document.getElementById("leadDays").onchange = (e) => {
  state.settings.leadDays = parseInt(e.target.value, 10);
  saveSettings();
  checkDueReminders(true);
};

/* ---------------- Export / Import ---------------- */
// Hands a file to the browser's downloader. The temporary link is released a minute later,
// not immediately: revoking it straight after click() can cancel the download on some phones.
function downloadFile(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// "My Fleet 2026-10-03 14-35.json". The time keeps every name unique, so Chrome never finds a
// file with the same name in Downloads and never asks "Download again?".
function backupFileName() {
  const d = new Date();
  return `My Fleet ${localISO(d)} ${String(d.getHours()).padStart(2, "0")}-${String(d.getMinutes()).padStart(2, "0")}.json`;
}
function performBackupExport(silent) {
  const payload = JSON.stringify({ vehicles: state.data.vehicles });
  downloadFile(new Blob([payload], { type: "application/json" }), backupFileName());
  if (!silent) showToast("Backup exported");
}

// Auto-backup: the first saved change of each day writes one file to Downloads, silently.
// (Every change is still kept as a restore point inside the app.)
let autoBackupTimer = null;
function scheduleDailyBackup() {
  if (state.settings.autoBackup === false) return;
  const today = localISO();
  if (state.settings.lastAutoBackupDay === today) return;
  state.settings.lastAutoBackupDay = today;
  saveSettings();
  clearTimeout(autoBackupTimer);
  autoBackupTimer = setTimeout(() => { try { performBackupExport(true); } catch (e) {} }, 250);
}

document.getElementById("exportBtn").onclick = () => performBackupExport(false);
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data = null;
    try { data = normalizeData(JSON.parse(reader.result)); } catch (err) {}
    if (!data) { showToast("That file isn't a My Fleet backup"); return; }
    const n = data.vehicles.length;
    if (!confirm(`Replace everything in the app with this backup (${n} vehicle${n === 1 ? "" : "s"})?`)) return;
    state.data = data;
    if (!saveData(false)) return;
    addRestorePoint();
    goToRoot();
    showToast("Backup imported");
  };
  reader.onerror = () => showToast("Couldn't open that file");
  reader.readAsText(file);
};

/* ---------------- Restore list ---------------- */
const restoreOverlay = document.getElementById("restoreOverlay");
function restoreLabel(t) {
  const d = new Date(t);
  const time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  if (localISO(d) === localISO()) return `Today ${time}`;
  if (localISO(d) === localISO(yesterday)) return `Yesterday ${time}`;
  return `${d.toLocaleDateString(undefined, { day: "numeric", month: "short" })} ${time}`;
}
function restoreSummary(data) {
  const vs = (data && data.vehicles) || [];
  const ev = vs.reduce((n, v) => n + CATEGORIES.reduce((m, c) => m + ((v.items && v.items[c.key]) || []).length, 0), 0);
  return `${vs.length} vehicle${vs.length === 1 ? "" : "s"} · ${ev} event${ev === 1 ? "" : "s"}`;
}
document.getElementById("restoreBtn").onclick = () => {
  const points = loadRestorePoints();
  if (!points.length) { showToast("No restore points yet"); return; }
  const current = JSON.stringify(state.data);
  const list = document.getElementById("restoreList");
  list.innerHTML = "";
  points.forEach(p => {
    const isNow = JSON.stringify(p.data) === current;
    const btn = document.createElement("button");
    btn.className = "restore-item";
    btn.disabled = isNow;
    btn.innerHTML = `<span class="when">${restoreLabel(p.t)}${isNow ? " · now" : ""}</span><span class="what">${restoreSummary(p.data)}</span>`;
    btn.onclick = () => {
      const data = normalizeData(p.data);
      if (!data) { showToast("That restore point can't be read"); return; }
      if (!confirm(`Go back to ${restoreLabel(p.t)}? Changes made after it will be replaced.`)) return;
      state.data = data;
      if (!saveData()) return;          // the restored state becomes the newest restore point
      goToRoot();
      showToast(`Restored to ${restoreLabel(p.t)}`);
    };
    list.appendChild(btn);
  });
  restoreOverlay.classList.add("open");
  pushNav();
};
document.getElementById("restoreClose").onclick = () => closeNav();

/* ---------------- Reminders / local notifications ---------------- */
function checkDueReminders(force) {
  if (!state.settings.notifications) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const todayKey = localISO();
  if (!force && state.settings.lastCheck === todayKey) return;
  state.settings.lastCheck = todayKey;
  saveSettings();

  const lead = state.settings.leadDays || 30;
  const due = [];
  state.data.vehicles.forEach(v => {
    CATEGORIES.forEach(cat => {
      (v.items[cat.key] || []).forEach(item => {
        if (isDone(item)) return;
        const days = daysUntil(item.dueDate);
        if (days !== null && days <= lead) {
          due.push({ v, cat, item, days });
        }
      });
    });
  });
  if (due.length === 0) {
    // Nothing qualifies under the current settings — clear any stale notification
    // still sitting in the tray from before (e.g. the lead time was just lowered).
    if (navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(reg => {
        reg.getNotifications({ tag: "fleet-log-due" }).then(notifs => notifs.forEach(n => n.close()));
      }).catch(() => {});
    }
    return;
  }

  const body = due.slice(0,3).map(d => `${d.v.name}: ${d.item.label} (${d.days < 0 ? "overdue" : d.days + "d left"})`).join("\n")
    + (due.length > 3 ? `\n+${due.length - 3} more` : "");

  const title = due.some(d => d.days < 0) ? "My Fleet: overdue events" : "My Fleet: events due soon";
  const options = { body, icon: "icons/icon-192.png", badge: "icons/badge-96.png", tag: "fleet-log-due" };

  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: "SHOW_NOTIFICATION", title, options });
  } else if (navigator.serviceWorker) {
    navigator.serviceWorker.ready.then(reg => reg.showNotification(title, options));
  } else {
    try { new Notification(title, options); } catch (e) {}
  }
}

/* ---------------- Service worker registration ---------------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// Re-check reminders whenever the app becomes visible (covers "opened the app" case
// since Android may not reliably wake background web pages for scheduled checks).
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (lastRenderDay !== localISO()) render();   // day changed while the app sat in the background
  checkDueReminders(false);
});

/* ---------------- Init ---------------- */
render();
restoreRootSentinel(); // root sentinel, so the first back press on the home page can be caught
if (dataLoadProblem) showToast("Saved data couldn't be read. Import a backup to restore");
// One-time cleanup of the removed photo/document feature: save the data without the old
// references, and delete the storage area that held the files themselves.
if (hadLegacyFields) saveData(false);
const FILES_REMOVED_KEY = "fleetlog_files_removed";
try {
  if (window.indexedDB && !localStorage.getItem(FILES_REMOVED_KEY)) {
    const req = indexedDB.deleteDatabase("fleetlog_files");
    req.onsuccess = () => { try { localStorage.setItem(FILES_REMOVED_KEY, "1"); } catch (e) {} };
  }
} catch (e) {}
setTimeout(() => checkDueReminders(false), 1200);
// Ask the browser to keep this app's data even when the phone is low on space. Installed apps
// are usually granted this silently; it doesn't protect against clearing data / uninstalling.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
}
</script>
